# 推送到 main 后自动构建并部署检测站到 Cloudflare Workers。
# 页脚显示的 commit 就是本次部署的提交，用来核对线上运行的是仓库里的代码。
# 需要仓库 Secret CLOUDFLARE_API_TOKEN（Cloudflare「Edit Cloudflare Workers」模板）与 CLOUDFLARE_ACCOUNT_ID；
# Worker 的运行时 secret（IP_HASH_SALT 等）已存在 Cloudflare 上，部署不会覆盖。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，后来的排队，不取消进行中的
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      # 版本取自 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm run deploy

      - name: Skip deploy (missing CLOUDFLARE_API_TOKEN)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::未配置 CLOUDFLARE_API_TOKEN，只做了类型检查，跳过部署"
